name: Проверка и установщик Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Установить сборщик установщика
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.7.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Проверить и собрать
        shell: pwsh
        run: ./packaging/Build-Windows.ps1
      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: AutoPunct-Windows
          path: dist/AutoPunct-*-Setup.exe
      - name: Сохранить результаты проверок
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-results
          path: |
            target/surefire-reports/
            build/native-x64/Testing/
            build/native-Win32/Testing/
